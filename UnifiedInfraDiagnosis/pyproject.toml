[project]
name = "unified-infra-diagnosis"
version = "0.1.0"
description = "诊断编排层：LangGraph 判定序执行器，消费 OKB REST 四原语"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
