# 复制为 local.yml 后填写；不覆盖已有配置，不将真实凭据提交到仓库。
env: local
http:
  host: 127.0.0.1
  port: 8000
security:
  jwt:
    key: "REPLACE_WITH_INDEPENDENT_JWT_SECRET"
data:
  db:
    main:
      driver: mysql
      dsn: "REPLACE_WITH_MYSQL_DSN"
log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/server.log"
  max_backups: 30
  max_age: 7
  max_size: 100
  compress: true
inventory:
  # 独立随机生成至少 32 字节的密钥，不与 JWT 共用；默认不授予任何权限。
  cursor_key: ""
  grants: []
  # grants 示例：user_id / permissions 两个字段。
  # permissions 可包含 inventory:read、sync:read、sync:write。
  worker:
    poll_interval_seconds: 1
    device_write_concurrency: 8
  cmdb:
    # sources 下的键与 MySQL sources.config_ref 对应；凭据只放配置，不写数据库。
    sources:
      example:
        base_url: "https://cmdb.example.invalid"
        allow_insecure_http: false
        headers: {}
        # 固定查询参数会安全编码到 URL；不要把值写入日志。
        query: {}
        # 每轮只同步一种实体；未配置时为 device，支持 data_center、cabinet、interface。
        # 完成来源当前任务后修改此项并重启 Worker，不在排队或运行中切换。
        entity_type: device
        # 开发阶段限定 IDC；过滤同步只新增、更新，不执行整源清理。
        device_condition:
          idc_id: 1030
        data_center_condition:
          inst_id: 1030
        cabinet_condition:
          idc_id: 1030
        # 端口按 IDC 内网络设备逐台追加 sn 查询；当前只同步物理口。
        interface_condition:
          idc_id: 1030
          port_type: physics
        transformer_condition:
          idc: 1030
        page_size: 20000
        concurrency: 5
        timeout_seconds: 30
        max_response_bytes: 67108864
  graph:
    # 留空时不连接图库；配置后必须指向本项目独立空间。
    hosts: [] # 示例：["127.0.0.1:9669"]
    space: ""
    username: ""
    password: ""
    timeout_seconds: 5
