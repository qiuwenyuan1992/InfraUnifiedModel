# 部署模板，不可原样用于生产；真实配置由部署环境管理。
env: prod
http:
  host: 0.0.0.0
  port: 8000
security:
  jwt:
    key: "REPLACE_WITH_INDEPENDENT_JWT_SECRET"
data:
  db:
    main:
      driver: mysql
      dsn: "REPLACE_WITH_MYSQL_DSN"
log:
  log_level: info
  mode: console
  encoding: json
  log_file_name: "./storage/logs/server.log"
  max_backups: 30
  max_age: 7
  max_size: 100
  compress: true
inventory:
  cursor_key: ""
  grants: []
  worker:
    poll_interval_seconds: 1
    device_write_concurrency: 8
  cmdb:
    sources:
      example:
        base_url: "https://cmdb.example.invalid"
        allow_insecure_http: false
        headers: {}
        query: {}
        # 生产全量同步不要配置 device_condition。
        page_size: 20000
        concurrency: 5
        timeout_seconds: 30
        max_response_bytes: 67108864
  graph:
    hosts: []
    space: ""
    username: ""
    password: ""
    timeout_seconds: 5
