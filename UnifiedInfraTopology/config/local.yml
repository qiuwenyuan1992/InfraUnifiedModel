  mode: both               #  file or console or both
  encoding: console           # json or console
  log_file_name: "./storage/logs/server.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
inventory:
  # 独立生成至少 32 字节的游标签名密钥；默认无授权。
  cursor_key: ""
  grants: []
  graph:
    # 配置独立图空间后启用；不得指向旧系统空间。
    hosts: [127.0.0.1:9669] # 示例：["127.0.0.1:9669"]
    space: ""
    username: "root"
    password: "nebula"
    timeout_seconds: 5