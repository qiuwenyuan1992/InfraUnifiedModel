basePath: /v1
definitions:
  repository.TopologyDirectoryPage:
    properties:
      items:
        items:
          $ref: '#/definitions/repository.TopologyNode'
        type: array
      next_after:
        type: string
    type: object
  repository.TopologyEdge:
    properties:
      created_at:
        type: string
      edge_type:
        type: string
      from:
        type: string
      id:
        type: string
      properties:
        additionalProperties: {}
        type: object
      rank:
        type: string
      relation_kind:
        type: string
      source_id:
        type: string
      synced_at:
        type: string
      to:
        type: string
    type: object
  repository.TopologyNeighborhood:
    properties:
      edges:
        items:
          $ref: '#/definitions/repository.TopologyEdge'
        type: array
      limit:
        type: integer
      nodes:
        items:
          $ref: '#/definitions/repository.TopologyNode'
        type: array
      root:
        $ref: '#/definitions/repository.TopologyNode'
      truncated:
        type: boolean
    type: object
  repository.TopologyNode:
    properties:
      created_at:
        type: string
      entity_type:
        type: string
      id:
        type: string
      label:
        type: string
      properties:
        additionalProperties: {}
        type: object
      source_id:
        type: string
      stable_id:
        type: string
      synced_at:
        type: string
    type: object
  service.SceneCabinet:
    properties:
      devices:
        items:
          $ref: '#/definitions/service.SceneNode'
        type: array
      next_after:
        type: string
      node:
        $ref: '#/definitions/service.SceneNode'
    type: object
  service.SceneEdge:
    properties:
      edge_type:
        type: string
      from:
        type: string
      id:
        type: string
      plane:
        type: integer
      power_path:
        type: string
      rank:
        type: string
      relation_kind:
        type: string
      source_id:
        type: string
      to:
        type: string
    type: object
  service.SceneNetworkLevel:
    properties:
      level:
        type: integer
      nodes:
        items:
          $ref: '#/definitions/service.SceneNode'
        type: array
      role:
        type: string
    type: object
  service.SceneNode:
    properties:
      entity_type:
        type: string
      id:
        type: string
      label:
        type: string
      parent_type_id:
        type: integer
      role:
        type: string
      source_id:
        type: string
      stable_id:
        type: string
      synced_at:
        type: string
    type: object
  service.SceneUnassigned:
    properties:
      node:
        $ref: '#/definitions/service.SceneNode'
      status:
        enum:
        - missing
        - ambiguous
        - truncated
        type: string
    type: object
  service.TopologyDeviceContext:
    properties:
      edges:
        items:
          $ref: '#/definitions/repository.TopologyEdge'
        type: array
      limit:
        type: integer
      nodes:
        items:
          $ref: '#/definitions/repository.TopologyNode'
        type: array
      root:
        $ref: '#/definitions/repository.TopologyNode'
      truncated:
        type: boolean
      warnings:
        items:
          type: string
        type: array
    type: object
  service.TopologyScene:
    properties:
      cabinets:
        items:
          $ref: '#/definitions/service.SceneCabinet'
        type: array
      edges:
        items:
          $ref: '#/definitions/service.SceneEdge'
        type: array
      network_levels:
        items:
          $ref: '#/definitions/service.SceneNetworkLevel'
        type: array
      next_after:
        type: string
      nodes:
        items:
          $ref: '#/definitions/service.SceneNode'
        type: array
      root:
        $ref: '#/definitions/service.SceneNode'
      truncated:
        type: boolean
      unassigned:
        items:
          $ref: '#/definitions/service.SceneUnassigned'
        type: array
      warnings:
        items:
          type: string
        type: array
    type: object
  v1.EnqueueInventoryRoundRequest:
    properties:
      mode:
        type: string
      source_id:
        type: string
    type: object
  v1.GetProfileResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/v1.GetProfileResponseData'
      message:
        type: string
    type: object
  v1.GetProfileResponseData:
    properties:
      nickname:
        example: alan
        type: string
      userId:
        type: string
    type: object
  v1.InventoryDiagnosticDTO:
    properties:
      code:
        type: string
      created_at:
        type: string
      field_path:
        type: string
      id:
        type: string
      object_ref:
        type: string
      resource:
        type: string
      run_id:
        type: string
      severity:
        type: string
      source_id:
        type: string
    type: object
  v1.InventoryDiagnosticPageDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.InventoryDiagnosticDTO'
        type: array
      next_cursor:
        type: string
    type: object
  v1.InventoryRoundDTO:
    properties:
      cancel_requested_at:
        type: string
      completed_phases:
        type: integer
      created_at:
        type: string
      error_code:
        type: string
      finished_at:
        type: string
      id:
        type: string
      mode:
        type: string
      phases:
        items:
          $ref: '#/definitions/v1.InventoryRoundPhaseDTO'
        type: array
      snapshot_at:
        type: string
      source_id:
        type: string
      started_at:
        type: string
      status:
        type: string
      total_phases:
        type: integer
    type: object
  v1.InventoryRoundPageDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.InventoryRoundDTO'
        type: array
      next_cursor:
        type: string
    type: object
  v1.InventoryRoundPhaseDTO:
    properties:
      edges:
        type: integer
      error_code:
        type: string
      finished_at:
        type: string
      missing_endpoints:
        type: integer
      name:
        type: string
      nodes:
        type: integer
      objects:
        type: integer
      position:
        type: integer
      run_id:
        type: string
      skipped:
        type: integer
      started_at:
        type: string
      status:
        type: string
    type: object
  v1.LoginRequest:
    properties:
      email:
        example: 1234@gmail.com
        type: string
      password:
        example: "123456"
        type: string
    required:
    - email
    - password
    type: object
  v1.LoginResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/v1.LoginResponseData'
      message:
        type: string
    type: object
  v1.LoginResponseData:
    properties:
      accessToken:
        type: string
    type: object
  v1.RegisterRequest:
    properties:
      email:
        example: 1234@gmail.com
        type: string
      password:
        example: "123456"
        type: string
    required:
    - email
    - password
    type: object
  v1.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  v1.UpdateProfileRequest:
    properties:
      email:
        example: 1234@gmail.com
        type: string
      nickname:
        example: alan
        type: string
    required:
    - email
    type: object
info:
  contact: {}
  description: Infrastructure inventory and synchronization control API. Generated
    documentation currently covers user endpoints only; see README for inventory contracts.
  license:
    name: MIT
  title: UnifiedInfraTopology API
  version: 1.0.0
paths:
  /inventory/sync-rounds:
    get:
      parameters:
      - description: Page size, 1–200
        in: query
        name: limit
        type: integer
      - description: Authenticated opaque cursor
        in: query
        name: cursor
        type: string
      - description: Current configured source ID
        in: query
        name: source_id
        type: string
      - description: Round status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.InventoryRoundPageDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: List durable synchronization rounds
      tags:
      - inventory
    post:
      consumes:
      - application/json
      parameters:
      - description: Printable ASCII key, 1–128 characters
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Current configured source; mode must be full
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.EnqueueInventoryRoundRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: Round resource URL
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.InventoryRoundDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: Enqueue a durable full synchronization round
      tags:
      - inventory
  /inventory/sync-rounds/{id}:
    get:
      parameters:
      - description: 32 lowercase hexadecimal round ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.InventoryRoundDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: Get round state and fixed fifteen-phase progress
      tags:
      - inventory
  /inventory/sync-rounds/{id}/cancel:
    post:
      parameters:
      - description: Round ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.InventoryRoundDTO'
              type: object
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.InventoryRoundDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: Cancel queued or cooperatively cancel running round without graph rollback
      tags:
      - inventory
  /inventory/sync-rounds/{id}/diagnostics:
    get:
      parameters:
      - description: Round ID
        in: path
        name: id
        required: true
        type: string
      - description: Page size, 1–200
        in: query
        name: limit
        type: integer
      - description: User, parent and filter-bound cursor
        in: query
        name: cursor
        type: string
      - description: Source filter
        in: query
        name: source_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.InventoryDiagnosticPageDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: List safe diagnostics across a round's child runs
      tags:
      - inventory
  /inventory/sync-runs/{run_id}/diagnostics:
    get:
      parameters:
      - description: Run ID
        in: path
        name: run_id
        required: true
        type: string
      - description: Page size, 1–200
        in: query
        name: limit
        type: integer
      - description: User, parent and filter-bound cursor
        in: query
        name: cursor
        type: string
      - description: Source filter
        in: query
        name: source_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.InventoryDiagnosticPageDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: List safe single-run diagnostics
      tags:
      - inventory
  /inventory/topology/children:
    get:
      parameters:
      - description: 32 lowercase hexadecimal source ID
        in: query
        name: source_id
        required: true
        type: string
      - description: Parent directory type
        enum:
        - data_center
        - pod
        - cabinet
        in: query
        name: entity_type
        required: true
        type: string
      - description: Exact stable parent ID, up to 256 bytes
        in: query
        name: stable_id
        required: true
        type: string
      - default: 50
        description: Maximum returned nodes
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque signed directory cursor, up to 4096 bytes
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/repository.TopologyDirectoryPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.Response'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: List explicit directory children with a parent-bound opaque cursor
      tags:
      - topology
  /inventory/topology/device-context:
    get:
      parameters:
      - description: 32 lowercase hexadecimal source ID
        in: query
        name: source_id
        required: true
        type: string
      - description: Exact device stable ID, up to 256 bytes
        in: query
        name: stable_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.TopologyDeviceContext'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.Response'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: Read fixed device dependencies without recursively expanding remote
        devices or power leaves
      tags:
      - topology
  /inventory/topology/neighbors:
    get:
      parameters:
      - description: 32 lowercase hexadecimal source ID
        in: query
        name: source_id
        required: true
        type: string
      - description: Entity type
        enum:
        - device
        - interface
        - gpu
        - pod
        - cabinet
        - data_center
        - rpp
        - ups_group
        - ups
        - transformer
        in: query
        name: entity_type
        required: true
        type: string
      - description: Stable ID, up to 256 bytes; power entities require canonical
          positive int64 inst_id
        in: query
        name: stable_id
        required: true
        type: string
      - default: 100
        description: Maximum returned edges
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - default: both
        description: Stored edge direction
        enum:
        - in
        - out
        - both
        in: query
        name: direction
        type: string
      - description: Optional edge family
        enum:
        - spatial_relation
        - composition_relation
        - network_relation
        - power_relation
        in: query
        name: edge_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/repository.TopologyNeighborhood'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.Response'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: Read a bounded, directed one-hop topology neighborhood
      tags:
      - topology
  /inventory/topology/node:
    get:
      parameters:
      - description: 32 lowercase hexadecimal source ID
        in: query
        name: source_id
        required: true
        type: string
      - description: Entity type
        enum:
        - device
        - interface
        - gpu
        - pod
        - cabinet
        - data_center
        - rpp
        - ups_group
        - ups
        - transformer
        in: query
        name: entity_type
        required: true
        type: string
      - description: Stable ID, up to 256 bytes; power entities require canonical
          positive int64 inst_id
        in: query
        name: stable_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/repository.TopologyNode'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.Response'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/v1.Response'
      security:
      - Bearer: []
      summary: Locate a topology node by its exact stable identity
      tags:
      - topology
  /inventory/topology/roots:
    get:
      parameters:
      - description: 32 lowercase hexadecimal source ID
        in: query
        name: source_id
        required: true
        type: string
      - description: Directory root type
        enum:
        - data_center
        - pod
        in: query
        name: entity_type
        required: true
        type: string
      - default: 50
        description: Maximum returned nodes
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque signed directory cursor, up to 4096 bytes
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/repository.TopologyDirectoryPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Response'
